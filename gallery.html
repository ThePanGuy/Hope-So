<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery — Hopeso</title>
    <meta name="description" content="Photographs of the Hopeso bar at weddings and events.">
    <link rel="icon" href="images/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">Hopeso</a>
      <nav class="nav" aria-label="Pages">
        <a href="index.html#about">About</a>
        <a href="index.html#bar">The bar</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero hero-compact">
        <p class="eyebrow">Gallery</p>
        <h1>The bar at the event.</h1>
        <p class="lede">
          These are stand-in drawings. Real photographs of weddings and events can replace them later.
        </p>
      </section>

      <section class="panel">
        <ul class="gallery">
          <li>
            <figure>
              <img src="images/bar.svg" alt="Illustrated bar counter set for an evening event">
              <figcaption>The bar</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="images/pour.svg" alt="Illustrated drink being poured into a glass">
              <figcaption>A pour</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="images/glasses.svg" alt="Illustrated row of glasses on a bar">
              <figcaption>Glasses</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="images/reception.svg" alt="Illustrated reception with a bar along one side of the room">
              <figcaption>A reception</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="images/evening.svg" alt="Illustrated bar in warm evening light">
              <figcaption>Evening service</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="images/toast.svg" alt="Illustrated two glasses raised together">
              <figcaption>A toast</figcaption>
            </figure>
          </li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>Hopeso</p>
      <p><a href="index.html">Back to the main page</a></p>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
